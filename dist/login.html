<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Bitwise Control</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fa;color:#17243b;font:15px system-ui,sans-serif}.card{background:white;border:1px solid #e7ecf3;border-radius:18px;padding:42px;width:min(420px,92vw);box-shadow:0 18px 60px #17243b08}.logo{background:#4367e9;color:white;display:inline-grid;place-items:center;width:45px;height:45px;border-radius:12px;font-size:26px;font-weight:700}h1{font-size:27px;margin:26px 0 8px}p{color:#7e899e;line-height:1.6}label{display:block;font-size:13px;margin:22px 0 8px}input{width:100%;padding:12px;border:1px solid #dfe5ed;border-radius:8px;font:inherit}button{margin-top:26px;width:100%;padding:13px;border:0;border-radius:8px;color:white;background:#4367e9;font:inherit;cursor:pointer}#error{color:#b43c50;font-size:13px;min-height:20px}</style><div class="card"><div class="logo">b.</div><h1>Welcome back</h1><p>Sign in to Bitwise Control.</p><form id="login"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus maxlength="128"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"><button>Sign in</button><p id="error" role="alert"></p></form></div><script>localStorage.removeItem('bitwise-control-v1');document.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('button');b.disabled=true;try{let r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(r.ok){location.href='/'}else{document.querySelector('#error').textContent=r.status===429?'Too many attempts. Try again in 15 minutes.':'Username or password is incorrect.'}}catch{document.querySelector('#error').textContent='Unable to connect. Please try again.'}finally{b.disabled=false}};</script></html>
